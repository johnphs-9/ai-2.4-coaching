<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>

  <style>
    .title { font-size: 22px; font-weight: 700; fill: #111; }
    .sub   { font-size: 12px; fill: #666; }
    .lbl   { font-size: 15px; font-weight: 600; fill: #111; }
    .mono  { font-size: 12px; fill: #333; font-family: "SF Mono", Menlo, monospace; }
    .small { font-size: 11px; fill: #777; }
    .box   { fill: #ffffff; stroke: #222; stroke-width: 1.5; }
    .box2  { fill: #fff7f0; stroke: #d98a3d; stroke-width: 1.5; }
    .box3  { fill: #f0f7ff; stroke: #3d7fd9; stroke-width: 1.5; }
    .down  { stroke: #3d7fd9; stroke-width: 2; fill: none; marker-end: url(#blue); }
    .up    { stroke: #d98a3d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#orange); }
    .legend{ font-size: 12px; fill: #333; }
  </style>

  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d7fd9"/>
    </marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d98a3d"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">Number Guessing Game — Component Architecture</text>
  <text x="40" y="60" class="sub">React 19 · Vite 8 · ESM · one-way data flow · 5 modules</text>

  <!-- App -->
  <rect x="360" y="90" width="280" height="120" rx="8" class="box"/>
  <text x="376" y="116" class="lbl">App.jsx</text>
  <text x="376" y="138" class="mono">state: secretNumber, guesses</text>
  <text x="376" y="158" class="mono">derived: status, won</text>
  <text x="376" y="178" class="mono">handlers: handleGuess, handleReset</text>
  <text x="376" y="198" class="small">single source of truth · lazy useState(makeSecret)</text>

  <!-- connectors App -> children (down) and children -> App (up) -->
  <line x1="440" y1="210" x2="220" y2="300" class="down"/>
  <line x1="500" y1="210" x2="500" y2="300" class="down"/>
  <line x1="560" y1="210" x2="780" y2="300" class="down"/>

  <line x1="250" y1="300" x2="440" y2="210" class="up"/>
  <line x1="560" y1="300" x2="560" y2="210" class="up"/>

  <text x="300" y="256" class="small" fill="#3d7fd9">props down</text>
  <text x="585" y="256" class="small" fill="#d98a3d">callback up</text>

  <!-- GameStatus -->
  <rect x="80" y="300" width="200" height="90" rx="8" class="box3"/>
  <text x="96" y="326" class="lbl">GameStatus</text>
  <text x="96" y="348" class="mono">prop: status</text>
  <text x="96" y="368" class="small">pure view · no state</text>
  <text x="96" y="384" class="small">renders &lt;p&gt; or null</text>

  <!-- GuessInput -->
  <rect x="400" y="300" width="200" height="90" rx="8" class="box2"/>
  <text x="416" y="326" class="lbl">GuessInput</text>
  <text x="416" y="348" class="mono">local: input, error</text>
  <text x="416" y="368" class="small">validate → onGuess / onReset</text>
  <text x="416" y="384" class="small">owned form state</text>

  <!-- GuessList -->
  <rect x="680" y="300" width="240" height="90" rx="8" class="box3"/>
  <text x="696" y="326" class="lbl">GuessList</text>
  <text x="696" y="348" class="mono">props: guesses, secret</text>
  <text x="696" y="368" class="small">dumb map · null if empty</text>
  <line x1="720" y1="390" x2="720" y2="470" class="down"/>
  <text x="735" y="435" class="small" fill="#3d7fd9">props down</text>

  <!-- GuessItem -->
  <rect x="680" y="470" width="240" height="90" rx="8" class="box3"/>
  <text x="696" y="496" class="lbl">GuessItem</text>
  <text x="696" y="518" class="mono">props: guess, secret</text>
  <text x="696" y="538" class="small">derived label (Correct/High/Low)</text>

  <!-- legend -->
  <line x1="80" y1="560" x2="120" y2="560" class="down"/>
  <text x="128" y="564" class="legend">props (data, down)</text>
  <line x1="300" y1="560" x2="340" y2="560" class="up"/>
  <text x="348" y="564" class="legend">callbacks (events, up)</text>
</svg>
